async function sameSha(b64,sha){if(!sha||!(window.crypto&&crypto.subtle))return false;try{const by=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),hd=new TextEncoder().encode('blob '+by.length+'\0'),all=new Uint8Array(hd.length+by.length);all.set(hd);all.set(by,hd.length);const d=await crypto.subtle.digest('SHA-1',all);return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')===sha}catch(e){return false}}

const MAN=[['প্রথমবার ঢোকা','GitHub username, repository নাম, branch (সাধারণত main) আর token দিয়ে Connect চাপুন। "Remember on this device" টিক দিলে পরের বার আর লিখতে হবে না। Token-এ শুধু এই repository-র জন্য Contents: Read and write অনুমতি থাকতে হবে।'],

['Festival page (EID EXCLUSIVE)','Festival page সেকশনে পেজের নাম, লেখা, ব্যানার ও গাইড ছবি দিন। Schedule-এ শুরু ও শেষের তারিখ-সময় দিলে পেজ নিজে Publish হয় ও সময় শেষে নিজে Unpublish হয়। চাইলে Publish now / Unpublish now চেপে হাতে বদলান। পণ্যে "Festival Exclusive product" টিক দিলে সেটা এই পেজে দেখায়।'],['কুপন ও অফার টাইমার','Coupons → + Generate coupon। কোড নিজে তৈরি হয় (বদলানো যায়), ছাড় % বা টাকায়, সর্বনিম্ন অর্ডার, কোন পণ্যে (সব / শুধু Festival), শুরু-শেষের সময়। ক্রেতা Checkout-এ কোড দিলে দাম কমে। Offer timer: Festival page → Offer timer। "Per visitor" দিলে প্রতিজন প্রথমবার সাইটে ঢোকার সময় থেকে ৩ ঘণ্টা (বা আপনার দেওয়া সময়) দেখে, "Fixed" দিলে সবার জন্য একই শেষ সময়। কুপনে "valid only while the offer timer is running" টিক দিলে অফার সত্যিই শেষ হয়।'],['সাইজ গাইড, Texts ও লোগো','Size guide-এ ক্যাটাগরি ধরে মাপের তালিকা দিন (প্রথম লাইন কলামের নাম, তারপর প্রতি লাইনে একটা সাইজ)। পণ্যের popup-এ "Size Guide" বাটন আসবে। Texts-এ "Add to Cart" ইত্যাদি লেখা বদলান। Site photos-এ Logo ছবি দিলে হেডারে বসে।'],['পণ্যের নিজস্ব লিংক, শেয়ার, WhatsApp-এ ছবির লিংক','প্রতিটা পণ্যের নিজস্ব পেজ হয় (p/পণ্য-id.html), Save করলে নিজে তৈরি হয়। পণ্যে Share বাটনে লিংক শেয়ার করুন, Facebook/Messenger-এ ছবি ও নামসহ প্রিভিউ আসবে। WhatsApp অর্ডার ও availability মেসেজে প্রতিটা পণ্যের ছবির লিংক যায় (ছবি সরাসরি attach হয় না, লিংকে ট্যাপ করলে ছবি দেখা যায়)। Settings → Website address ঠিক রাখুন।'],['Facebook Pixel, Analytics, অর্ডার শিট','Settings → Website address & tracking-এ Facebook Pixel ID ও Google Analytics ID বসান (ঐচ্ছিক)। Order sheet link-এ Google Apps Script-এর /exec লিংক দিলে প্রতিটা অর্ডার Google Sheet-এও জমা হয় (Orders-Code.gs ও গাইড zip-এ আছে)।'],['পণ্য, ক্যাটাগরি, পেজ Publish / Unpublish','প্রতিটা পণ্য, ক্যাটাগরি ও পেজের কার্ডে Publish / Unpublish বাটন আছে। তারপর Save & Publish চাপুন।'],['Payment (bKash QR, link, Bangla QR)','Payment সেকশনের ওপরের বাটনে Online Selling & Payment ON/OFF করুন। OFF হলে ক্রেতা শুধু WhatsApp-এ কথা বলবে। ON হলে Checkout পেজে bKash QR ছবি, bKash payment লিংক ও Bangla QR দেখাবে। QR ছবি "Choose photo" দিয়ে আপলোড করুন, bKash নম্বর ও লিংক বসান। ON করার আগে আসল QR ছবি দিন।'],['Backup','Backup সেকশন থেকে সর্বশেষ সেভ-করা অবস্থার ব্যাকআপ ফাইল নামানো যায়। প্রতিবার Save করার আগে নিজে থেকেও নামে (বন্ধ করা যায়)। পরে "Restore" দিয়ে ফাইলটি দিলে সব ফিরে আসে, তারপর Save & Publish চাপুন। ছবি GitHub-এই থাকে।'],['Draft ও Review & Publish','এখন Save আর Publish আলাদা। নিচের বারে বাঁদিকের বাটন Save draft (খসড়া এই ডিভাইসে রাখে, সাইটে কিছু যায় না)। ডানদিকের Review & Publish চাপলে কী কী বদল হবে তার তালিকা আসে (পণ্য, ছবি, সেটিং ইত্যাদি, টিক চিহ্নসহ)। যেটা এখনই সাইটে দিতে চান না তার টিক তুলে দিন, ওটা খসড়ায় থাকবে। Publish selected চাপলে শুধু টিক-দেওয়াগুলো যায়, শেষে ✓ দিয়ে দেখায় কী কী Publish হলো।'],['Delivery ON/OFF ও পেমেন্ট পদ্ধতি','Payment সেকশনে Delivery বাটন আছে। OFF থাকলে ক্রেতাকে ঠিকানা বা ডেলিভারি এলাকা জিজ্ঞেস করা হয় না, ডেলিভারি চার্জও যোগ হয় না, ক্রেতা শোরুম থেকে নেয়। Cash, bKash, Nagad ও Bangla QR আলাদা আলাদা চালু/বন্ধ করা যায়। QR ছবি আপলোড করলে QR ছবি দেখানোর টিক নিজে পড়ে; আসল ছবি না দিলে টিক দেবেন না।'],['Save & Publish কীভাবে কাজ করে','নিচের বাটন সব বদল এক GitHub commit-এ পাঠায়। সাইটে আসতে ১–২ মিনিট লাগে। বদল বাকি থাকলে বাটনের পাশে "N unsaved changes" লেখা থাকে। ভুল হলে GitHub-এর History থেকে আগের অবস্থায় ফেরা যায়।'],
